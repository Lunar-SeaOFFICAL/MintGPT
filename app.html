<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MintGPT</title>
<style>
:root{--bg:#101a17;--side:#0c1411;--card:#182722;--hov:#1f332c;--bd:#284237;--tx:#e1f4e9;--mu:#8aa899;--mint:#43d3a0;--ink:#0e3325}
body.light{--bg:#fbfffc;--side:#f0faf4;--card:#fff;--hov:#e2f5ea;--bd:#d2ebe0;--tx:#173d30;--mu:#6d8c7f;--mint:#2bc48d;--ink:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:250px 1fr;height:100vh}
.side{background:var(--side);border-right:1px solid var(--bd);padding:12px;display:flex;flex-direction:column;gap:8px}
button{cursor:pointer;font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px}
button:hover{border-color:var(--mint)}
.new{background:rgba(67,211,160,.15);font-weight:600;text-align:left}
#hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
#hist button{border:0;background:transparent;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hist button.on{background:var(--hov);color:var(--mint);font-weight:700}
.main{display:flex;flex-direction:column;height:100vh;min-width:0}
.top{height:54px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.tag{font-size:11px;background:rgba(67,211,160,.16);color:var(--mint);padding:2px 8px;border-radius:99px;font-weight:700;margin-left:6px}
.feed{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column}
.welcome{margin:auto;text-align:center;max-width:560px;width:100%}
.av{width:56px;height:56px;border-radius:18px;border:2px solid var(--mint);overflow:hidden;margin:0 auto 12px;display:grid;place-items:center;font-weight:800;color:var(--mint);background:#16382c}
.av img,.avs img{width:100%;height:100%;object-fit:cover;display:block}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.cards button{text-align:left;padding:12px}
.cards b{display:block;color:var(--mint);font-size:13px}
.cards span{font-size:12px;color:var(--mu)}
#msgs{width:min(740px,100%);margin:0 auto;display:flex;flex-direction:column;gap:16px}
.m{display:flex;gap:10px;align-items:flex-start;line-height:1.55}
.m.guest{justify-content:flex-end}
.m.guest .b{background:var(--hov);border:1px solid var(--bd);padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:78%;white-space:pre-wrap;overflow-wrap:anywhere}
.m.ai .b{flex:1;white-space:pre-wrap;overflow-wrap:anywhere;padding-top:3px}
.m.sys{justify-content:center}.m.sys .b{font-size:12px;color:var(--mu);background:var(--side);padding:4px 12px;border-radius:99px;border:1px solid var(--bd)}
.avs{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--mint);overflow:hidden;flex-shrink:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--mint);background:#16382c}
.foot{width:min(740px,100%);margin:0 auto;padding:0 14px 14px}
.wbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.wbar button{font-size:12px;padding:5px 9px}
#typ{min-height:18px;font-size:12px;color:var(--mint);margin-bottom:4px;font-weight:600}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:8px 10px 8px 16px;display:flex;align-items:flex-end;gap:8px}
.box:focus-within{border-color:var(--mint)}
textarea{flex:1;background:transparent;border:0;outline:0;color:var(--tx);font:inherit;resize:none;min-height:24px;max-height:130px;padding:4px 0}
.send{width:34px;height:34px;border-radius:50%;border:0;background:var(--mint);color:var(--ink);font-weight:800;padding:0;flex-shrink:0}
@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <button class="new" onclick="resetChat()">✦ New mint chat</button>
    <div style="font-size:11px;color:var(--mu);font-weight:700;padding:4px" id="stitle">CHATS</div>
    <div id="hist"></div>
  </aside>
  <main class="main">
    <header class="top">
      <div><b>MintGPT 4o</b><span class="tag" id="rtag">MINT</span></div>
      <div style="display:flex;gap:6px;align-items:center">
        <span id="stat" style="font-size:12px;color:var(--mu);font-weight:600">○ Connecting...</span>
        <button id="onBtn" onclick="togOn()" style="display:none;font-size:12px">Go offline</button>
        <button onclick="document.body.classList.toggle('light')" style="font-size:12px">☀/☾</button>
        <button id="outBtn" onclick="logout()" style="display:none;font-size:12px">Log out</button>
      </div>
    </header>
    <div class="feed" id="feed">
      <div class="welcome" id="wel">
        <div class="av"><img src="avatar.png" alt="M" onerror="this.parentNode.textContent='M'"></div>
        <h2 style="margin:0 0 6px">What's on your mind?</h2>
        <div style="color:var(--mu);font-size:14px">Same helpful AI energy. A fresh minty look.</div>
        <div class="cards">
          <button onclick="ask('Help me debug a Minecraft plugin')"><b>✦ Debug code</b><span>Fix a plugin or datapack</span></button>
          <button onclick="ask('Give me 3 YouTube video ideas')"><b>✦ Brainstorm</b><span>Fresh video concepts</span></button>
          <button onclick="ask('Explain quantum computers simply')"><b>✦ Explain</b><span>Clear, simple breakdowns</span></button>
          <button onclick="ask('Write a short story about a green slime')"><b>✦ Write</b><span>Stories & character lore</span></button>
        </div>
      </div>
      <div id="msgs" style="display:none"></div>
    </div>
    <div class="foot">
      <div class="wbar" id="wbar" style="display:none">
        <button onclick="pre('Thinking through your request...')">⚡ Thinking</button>
        <button onclick="pre('Here is what I found:')">⚡ Breakdown</button>
        <button onclick="pulse()">⏳ Pulse Dots</button>
      </div>
      <div id="typ"></div>
      <form class="box" onsubmit="send(event)">
        <textarea id="inp" rows="1" placeholder="Message MintGPT..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}" oninput="this.style.height='24px';this.style.height=Math.min(this.scrollHeight,130)+'px'"></textarea>
        <button type="submit" class="send">↑</button>
      </form>
    </div>
  </main>
</div>

<script src="https://unpkg.com"></script>
<script>
const P="mintgpt/live/7xq9-42/",W=document.cookie.indexOf("mintgpt_wizard=true")!==-1;
let gid=sessionStorage.getItem("mgid")||("g_"+Math.random().toString(36).slice(2,7));
sessionStorage.setItem("mgid",gid);
let on=true,cl=null,ok=false,act=null,seen={},chats={};
const $=id=>document.getElementById(id);

function logout(){document.cookie="mintgpt_wizard=;path=/;max-age=0";location.href="index.html";}
if(W){$("rtag").textContent="WIZARD";$("onBtn").style.display="";$("outBtn").style.display="";$("wbar").style.display="flex";$("stitle").textContent="LIVE GUESTS";$("inp").placeholder="Reply as MintGPT...";}

if(typeof mqtt!=="undefined"){
  cl=mqtt.connect("wss://://hivemq.com",{clientId:"mg_"+Math.random().toString(16).slice(2,9),reconnectPeriod:2000});
  cl.on("connect",()=>{
    ok=true;setSt(true);
    if(W){cl.subscribe(P+"w/#");pub("s",{on});add("sys","Live relay ready. Waiting for guests...");}
    else{cl.subscribe(P+"s");cl.subscribe(P+"g/"+gid);pub("w/ping",{gid});}
  });
  cl.on("message",(t,b)=>{
    let d;try{d=JSON.parse(b.toString());}catch{return;}
    if(W&&d.gid){
      if(!chats[d.gid])chats[d.gid]=[];
      seen[d.gid]=Date.now();
      if(t.endsWith("/ping")){side();if(!act)openC(d.gid);pub("s",{on});}
      else if(t.endsWith("/msg")){chats[d.gid].push({s:"guest",t:d.t});side();if(!act)act=d.gid;if(act===d.gid)draw(d.gid);if(on)pub("g/"+d.gid,{k:"th",v:1});}
    }else if(!W){
      if(t===P+"s")setSt(d.on);
      else if(t===P+"g/"+gid){if(d.k==="th")$("typ").textContent=d.v?"✦ MintGPT is thinking...":"";if(d.k==="re"){$("typ").textContent="";stream(d.t);}}
    }
  });
  cl.on("offline",()=>{ok=false;setSt(false);});
}
setInterval(()=>{if(ok){if(W){pub("s",{on});side();}else pub("w/ping",{gid});}},4000);
function pub(s,o){if(cl&&ok)cl.publish(P+s,JSON.stringify(o));}
function setSt(v){$("stat").textContent=v?"● Online":"○ Offline";$("stat").style.color=v?"var(--mint)":"var(--mu)";if(W)$("onBtn").textContent=v?"Go offline":"Go online";}
function togOn(){on=!on;setSt(on);pub("s",{on});}
function pre(t){$("inp").value=t;$("inp").focus();}
function pulse(){if(act)pub("g/"+act,{k:"th",v:1});}
function openC(id){act=id;side();draw(id);}
function side(){const h=$("hist");h.innerHTML="";Object.keys(chats).forEach((id,i)=>{const b=document.createElement("button");b.textContent=((Date.now()-(seen[id]||0))<12000?"🟢 ":"⚪ ")+"Guest "+(i+1);if(id===act)b.classList.add("on");b.onclick=()=>openC(id);h.appendChild(b);});}
function draw(id){$("wel").style.display="none";const m=$("msgs");m.style.display="flex";m.innerHTML="";(chats[id]||[]).forEach(x=>add(x.s,x.t));}
function add(s,t){$("wel").style.display="none";const m=$("msgs");m.style.display="flex";const r=document.createElement("div");r.className="m "+s;if(s==="ai")r.innerHTML='<div class="avs"><img src="avatar.png" alt="M" onerror="this.parentNode.textContent=\'M\'"></div>';const b=document.createElement("div");b.className="b";b.textContent=t;r.appendChild(b);m.appendChild(r);$("feed").scrollTop=$("feed").scrollHeight;return b;}
function stream(t){const b=add("ai",""),w=t.split(" ");let i=0;const iv=setInterval(()=>{if(i<w.length){b.textContent+=(i?" ":"")+w[i++];$("feed").scrollTop=$("feed").scrollHeight;}else clearInterval(iv);},40);}
