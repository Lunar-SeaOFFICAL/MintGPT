<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MintGPT</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171717;color:#ececec;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
  .gate-card{width:min(380px,100%);background:#212121;border:1px solid #2f2f2f;border-radius:20px;padding:32px 26px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .avatar{width:76px;height:76px;border-radius:50%;margin:0 auto 14px;overflow:hidden;border:2px solid #10a37f;background:#16382c;display:grid;place-items:center;font-size:30px;font-weight:800;color:#10a37f}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  h1{margin:0 0 6px;font-size:24px;font-weight:700;letter-spacing:-.5px}
  p{color:#9b9b9b;margin:0 0 22px;font-size:14px}
  input{width:100%;padding:13px 14px;border:1px solid #383838;border-radius:12px;font:inherit;margin-bottom:12px;background:#171717;color:#ececec;outline:none;transition:border-color .15s}
  input:focus{border-color:#10a37f}
  button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;width:100%;font:inherit;font-weight:600;transition:opacity .15s,background .15s}
  .btn-primary{background:#10a37f;color:#fff}
  .btn-primary:hover{background:#0e906f}
  .btn-guest{margin-top:10px;background:#2f2f2f;color:#ececec;border:1px solid #3e3e3e}
  .btn-guest:hover{background:#383838}
  #error{color:#ef4444;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
  <div class="gate-card">
    <div class="avatar"><img src="avatar.png" alt="M" onerror="this.parentNode.textContent='M'"></div>
    <h1>Welcome to MintGPT</h1>
    <p>Log in with your Wizard key or continue as a guest</p>
    <input id="code" type="password" placeholder="Wizard passcode" autocomplete="off" onkeydown="if(event.key==='Enter')loginWizard()">
    <button type="button" class="btn-primary" onclick="loginWizard()">Log in</button>
    <button type="button" class="btn-guest" onclick="enterGuest()">Continue as Guest</button>
    <div id="error"></div>
  </div>

<script>
  const PASSCODE = "Mint-7XQ9-Violet#42";

  // Auto-skip gate if already logged in as Wizard
  if (document.cookie.indexOf("mintgpt_wizard=true") !== -1) {
    window.location.replace("app.html");
  }

  function loginWizard() {
    const val = document.getElementById("code").value.trim();
    if (val === PASSCODE) {
      document.cookie = "mintgpt_wizard=true; path=/; max-age=86400; SameSite=Lax";
      window.location.href = "app.html";
    } else {
      document.getElementById("error").textContent = "Invalid Wizard passcode.";
    }
  }

  function enterGuest() {
    document.cookie = "mintgpt_wizard=; path=/; max-age=0; SameSite=Lax";
    window.location.href = "app.html";
  }
</script>
</body>
</html>
