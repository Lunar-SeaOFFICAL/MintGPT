<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MintGPT</title>
<style>
:root{--mint:#43d3a0;--deep:#174d3b;--pale:#effaf4;--line:#dceee4;--page:#fbfffc;--panel:#ffffff;--side:#f1faf5;--ink:#214c3d;--muted:#81998e}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:15px system-ui,Segoe UI,sans-serif;transition:background .2s,color .2s}body.dark{--page:#101a17;--panel:#182722;--side:#14211c;--ink:#e1f4e9;--deep:#e1f4e9;--line:#294338;--muted:#a0b9ac;color-scheme:dark}body.dark .login,body.dark form#chat,body.dark .suggestions button{background:var(--panel);color:var(--ink)}body.dark .side{background:var(--side)}body.dark .top{background:var(--page)}body.dark input,body.dark textarea{background:transparent;color:var(--ink)}body.dark .welcome p,body.dark .hint{color:#9ab5a7}body.dark .guest{background:#20372c}body.dark .bubble{color:#d8eee2}body.dark #guestBanner{background:#1c3027!important;color:#c0dfcc!important}
#gate{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:linear-gradient(145deg,#0d1713,#172a21);padding:20px}
.login{width:min(390px,100%);background:#182722;color:#e1f4e9;border:1px solid #294338;border-radius:22px;padding:28px;text-align:center;box-shadow:0 18px 60px #0008}
.avatar{object-fit:cover;border-radius:14px}.login img{width:86px;height:86px;border-radius:22px}.login h1{margin:12px 0 4px}.login p{color:#a0b9ac;margin:0 0 18px}
input{width:100%;padding:13px;border:1px solid #385448;border-radius:11px;font:inherit;margin-bottom:10px;background:#101a17;color:#e1f4e9}button{cursor:pointer;border:0;border-radius:11px;padding:12px 16px;background:var(--mint);color:#123e2e;font-weight:750}#unlock{width:100%}#error{color:#ff929c;font-size:12px;min-height:20px;margin-top:8px}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#f1faf5;border-right:1px solid var(--line);padding:20px 15px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:850}.brand img{width:35px;height:35px;border-radius:11px}
.new{width:100%;text-align:left}.small{font-size:11px;color:#8aa397;text-transform:uppercase;letter-spacing:1px;margin:5px 8px}
#history button{display:block;width:100%;background:transparent;text-align:left;color:#547466;font-weight:500;margin:3px 0}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;font-weight:750}.top img{width:36px;height:36px;border-radius:50%}
.content{width:min(820px,calc(100% - 34px));margin:auto;flex:1;display:flex;flex-direction:column}
.welcome{text-align:center;margin:auto;padding:45px 0 25px}.welcome img{width:76px;height:76px;border-radius:22px}.welcome h2{font-size:38px;letter-spacing:-1.4px;margin:14px 0 6px}.welcome p{color:#81998e;margin:0}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:590px;margin:25px auto 0}.suggestions button{background:white;border:1px solid var(--line);text-align:left;color:#45695a}.suggestions span{display:block;font-size:12px;color:#8aa397;font-weight:400;margin-top:3px}
#messages{padding:30px 0;display:grid;gap:18px}.msg{display:flex;align-items:flex-start;gap:11px}.msg img{width:34px;height:34px;border-radius:10px}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:6px 0;line-height:1.6}.msg.guest .bubble{background:#eff8f2;border-radius:13px;padding:10px 13px}.msg.system .bubble{color:#668477;font-style:italic;font-size:13px}.composer-wrap{position:sticky;bottom:0;width:100%;min-width:0;background:linear-gradient(transparent,var(--page) 20%);padding:14px 0 20px}
form#chat{display:flex;flex-direction:row;gap:10px;align-items:flex-end;width:100%;max-width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:10px 11px 10px 15px;overflow:hidden}textarea{display:block;flex:1 1 auto;width:0;min-width:0;resize:none;border:0;outline:0;font:inherit;min-height:28px;max-height:140px;color:var(--deep);background:transparent;padding:5px 0}#send{flex:0 0 40px;width:40px;height:40px;padding:0;font-size:20px}#send:disabled{opacity:.4}
.hint{text-align:center;font-size:11px;color:#94a99f;margin-top:9px}
.profile-fields{margin:16px 0 10px;text-align:left}.profile-fields label{display:block;font-size:12px;color:#a0b9ac;margin:8px 0 5px}.profile-fields input{margin-bottom:7px}.profile-fields input[type=file]{font-size:12px;padding:9px}.profile-note{font-size:11px;color:#8aa397;margin:2px 0 8px}.profile-name{font-size:11px;font-weight:750;color:var(--muted);margin:0 0 4px 2px}.msg.guest{align-items:flex-start}.msg.guest .bubble{margin-top:0}
@media(max-width:680px){.content{width:calc(100% - 28px);max-width:100%}.composer-wrap{padding-bottom:16px}form#chat{width:100%}.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 16px}.welcome h2{font-size:30px}.suggestions{grid-template-columns:1fr}}
#history{display:grid;gap:5px}#history button{display:block;width:100%;text-align:left;background:transparent;color:#547466;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:9px 10px}#history button.selected{background:#dff4e8;color:#174d3b}body.dark #history button{color:#c3d9cc}body.dark #history button.selected{background:#244234;color:#e1f4e9}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.tools button{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:12px;padding:7px 10px;border-radius:9px}.tools button:hover{border-color:var(--mint)}
#typing{min-height:20px;font-size:12px;color:#8aa397;padding:0 2px}.suggestion-wrap{position:relative;min-width:0}.suggestion-wrap>button:first-child{width:100%;height:100%;padding-right:30px}.suggestion-wrap .dismiss{position:absolute;right:6px;top:6px;width:23px;height:23px;padding:0;border-radius:50%;background:transparent;color:#82988d;font-size:18px;line
