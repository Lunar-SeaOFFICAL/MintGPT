<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MintGPT</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#1a3329,#0d1713);color:#e1f4e9;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
  .gate-card{width:min(380px,100%);background:#16251f;border:1px solid #2b4a3d;border-radius:22px;padding:32px 26px;text-align:center;box-shadow:0 20px 55px rgba(0,0,0,.55)}
  .avatar{width:80px;height:80px;border-radius:22px;margin:0 auto 14px;overflow:hidden;border:2px solid #43d3a0;background:#1b3b2e;display:grid;place-items:center;font-size:32px;font-weight:800;color:#43d3a0;box-shadow:0 0 25px rgba(67,211,160,.2)}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  h1{margin:0 0 6px;font-size:25px;font-weight:750;letter-spacing:-.5px;color:#e8faf0}
  p{color:#94b5a5;margin:0 0 22px;font-size:14px}
  input{width:100%;padding:13px 14px;border:1px solid #2e5243;border-radius:12px;font:inherit;margin-bottom:12px;background:#0f1a15;color:#e1f4e9;outline:none;transition:border-color .15s}
  input:focus{border-color:#43d3a0}
  button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;width:100%;font:inherit;font-weight:700;transition:filter .15s,background .15s}
  .btn-primary{background:#43d3a0;color:#0f3325}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn-guest{margin-top:10px;background:#21382f;color:#d6f2e3;border:1px solid #325748}
  .btn-guest:hover{background:#29463b}
  #error{color:#ff8f9c;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
  <div class="gate-card">
    <div class="avatar"><img src="avatar.png" alt="M" onerror="this.parentNode.textContent='M'"></div>
    <h1>Welcome to MintGPT</h1>
    <p>A little more refreshing. Log in or continue as guest.</p>
    <input id="code" type="password" placeholder="Wizard passcode" autocomplete="off" onkeydown="if(event.key==='Enter')loginWizard()">
    <button type="button" class="btn-primary" onclick="loginWizard()">Enter MintGPT</button>
    <button type="button" class="btn-guest" onclick="enterGuest()">Continue as Guest</button>
    <div id="error"></div>
  </div>

<script>
  const PASSCODE = "Mint-7XQ9-Violet#42";

  if (document.cookie.indexOf("mintgpt_wizard=true") !== -1) {
    window.location.replace("app.html");
  }

  function loginWizard() {
    const val = document.getElementById("code").value.trim();
    if (val === PASSCODE) {
      document.cookie = "mintgpt_wizard=true; path=/; max-age=86400; SameSite=Lax";
      window.location.href = "app.html";
    } else {
      document.getElementById("error").textContent = "Invalid Wizard passcode.";
    }
  }

  function enterGuest() {
    document.cookie = "mintgpt_wizard=; path=/; max-age=0; SameSite=Lax";
    window.location.href = "app.html";
  }
</script>
</body>
</html>
